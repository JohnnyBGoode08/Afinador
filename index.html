<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Afinador Multi-Instrumento Pro</title>
  <style>
    :root {
      --bg-color: #12151c;
      --card-bg: #1c202b;
      --accent-green: #00e676;
      --accent-red: #ff5252;
      --accent-orange: #ffab40;
      --accent-blue: #00b0ff;
      --accent-kofi: #ff5e5b;
      --text-main: #ffffff;
      --text-muted: #8e99a8;
      --border-color: #2a3140;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 12px 10px;
      overflow-x: hidden;
    }

    /* Selector de Instrumento Superior */
    .instrument-tabs {
      display: flex;
      background-color: var(--card-bg);
      border-radius: 25px;
      padding: 3px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 340px;
      margin-bottom: 6px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
      color: #000;
      box-shadow: 0 2px 10px rgba(0, 230, 118, 0.3);
    }

    /* Submodos (Auto/Manual y Afinaciones) */
    .submode-bar {
      display: flex;
      gap: 6px;
      width: 100%;
      max-width: 340px;
      margin-bottom: 6px;
    }

    .submode-toggle {
      display: flex;
      flex: 1;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 2px;
      border: 1px solid var(--border-color);
    }

    .submode-btn {
      flex: 1;
      padding: 6px;
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
    }

    .submode-btn.active {
      background-color: var(--border-color);
      color: var(--text-main);
    }

    /* Medidor de Aguja */
    .gauge-container {
      position: relative;
      width: 260px;
      height: 130px;
      margin: 2px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    .gauge-arc {
      position: absolute;
      top: 0;
      width: 240px;
      height: 120px;
      border-top-left-radius: 120px;
      border-top-right-radius: 120px;
      border: 5px solid var(--border-color);
      border-bottom: none;
      background: radial-gradient(circle at 50% 100%, rgba(255,255,255,0.03), transparent 70%);
    }

    .center-mark {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 12px;
      background-color: var(--accent-green);
      border-radius: 2px;
      box-shadow: 0 0 8px var(--accent-green);
    }

    .needle {
      position: absolute;
      bottom: 18px;
      left: 50%;
      width: 4px;
      height: 90px;
      background: linear-gradient(to top, var(--text-muted), var(--text-main));
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
      transition: transform 0.1s cubic-bezier(0.1, 0.3, 0.1, 1.0);
      border-radius: 2px;
    }

    .needle.in-tune {
      background: var(--accent-green);
      box-shadow: 0 0 14px var(--accent-green);
    }

    .needle-pivot {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 15px;
      height: 15px;
      background-color: var(--card-bg);
      border: 3px solid var(--text-muted);
      border-radius: 50%;
      z-index: 2;
    }

    /* Visualización de Nota & Frecuencia */
    .note-display {
      text-align: center;
      margin: 2px 0;
    }

    .note-name {
      font-size: 3.2rem;
      font-weight: 800;
      line-height: 1;
      color: var(--text-main);
      transition: color 0.2s;
    }

    .note-name.in-tune {
      color: var(--accent-green);
      text-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
    }

    .frequency-text {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 3px;
    }

    .cents-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* Grid de Cuerdas (Guitarra & Charango) */
    .headstock {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 25px;
      width: 100%;
      max-width: 320px;
      margin: 6px 0;
    }

    .string-btn {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-main);
    }

    .string-btn.selected {
      border-color: var(--accent-green);
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.2);
      background-color: rgba(0, 230, 118, 0.05);
    }

    .string-name {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .string-desc {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* Piano Realista (Modo Cromático) */
    .piano-container {
      display: none;
      position: relative;
      width: 100%;
      max-width: 330px;
      height: 115px;
      margin: 6px auto;
      background-color: #0d0f14;
      border-radius: 12px;
      padding: 6px;
      border: 1px solid var(--border-color);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
    }

    .piano-keys-wrapper {
      position: relative;
      display: flex;
      width: 100%;
      height: 100%;
    }

    .white-key {
      flex: 1;
      background: linear-gradient(to bottom, #ffffff 0%, #e6ecf2 100%);
      border: 1px solid #1c202b;
      border-radius: 0 0 5px 5px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      color: #1a202c;
      box-shadow: 0 3px 5px rgba(0,0,0,0.3);
      transition: all 0.1s ease;
      z-index: 1;
    }

    .white-key:active, .white-key.selected {
      background: linear-gradient(to bottom, #00e676 0%, #00b0ff 100%) !important;
      color: #000 !important;
      box-shadow: 0 0 12px var(--accent-green);
      transform: translateY(2px);
    }

    .black-key {
      position: absolute;
      top: 0;
      width: 9%;
      height: 58%;
      background: linear-gradient(to bottom, #2c3240 0%, #11141a 100%);
      border: 1px solid #000;
      border-radius: 0 0 4px 4px;
      cursor: pointer;
      z-index: 2;
      box-shadow: 2px 3px 6px rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 4px;
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--accent-blue);
      transition: all 0.1s ease;
    }

    .black-key:active, .black-key.selected {
      background: var(--accent-green) !important;
      color: #000 !important;
      box-shadow: 0 0 10px var(--accent-green);
      transform: translateY(2px);
    }

    /* Sección Apoyo / Donación Ko-fi */
    .support-box {
      width: 100%;
      max-width: 330px;
      margin: 8px auto 4px;
      text-align: center;
      background-color: var(--card-bg);
      border: 1px dashed var(--border-color);
      padding: 10px;
      border-radius: 16px;
    }

    .support-text {
      font-size: 0.74rem;
      color: var(--text-muted);
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .support-text b {
      color: var(--accent-green);
    }

    .kofi-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: var(--accent-kofi);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      box-shadow: 0 3px 12px rgba(255, 94, 91, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .kofi-btn:active {
      transform: scale(0.97);
    }

    /* Botón Principal */
    .controls {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 330px;
      gap: 6px;
      margin-top: 4px;
    }

    .btn-main {
      background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
      border: none;
      border-radius: 30px;
      color: #000;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 12px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
    }
  </style>
</head>
<body>

  <!-- Selector de Instrumento -->
  <div class="instrument-tabs">
    <button class="tab-btn active" id="tabGuitar" onclick="switchInstrument('guitar')">🎸 Guitarra</button>
    <button class="tab-btn" id="tabCharango" onclick="switchInstrument('charango')">🪕 Charango</button>
    <button class="tab-btn" id="tabChromatic" onclick="switchInstrument('chromatic')">🎹 Piano / Cromático</button>
  </div>

  <!-- Barra de Submodos -->
  <div class="submode-bar" id="submodeBar">
    <div class="submode-toggle">
      <button class="submode-btn active" id="subAuto" onclick="setSubmode('auto')">Auto</button>
      <button class="submode-btn" id="subManual" onclick="setSubmode('manual')">Manual</button>
    </div>
    <!-- Selector de Afinación Guitarra -->
    <div class="submode-toggle" id="tuningToggle">
      <button class="submode-btn active" id="tuneStandard" onclick="setGuitarTuning('standard')">Estándar</button>
      <button class="submode-btn" id="tuneDropD" onclick="setGuitarTuning('dropD')">Drop D</button>
    </div>
  </div>

  <!-- Medidor de Aguja -->
  <div class="gauge-container">
    <div class="gauge-arc"></div>
    <div class="center-mark"></div>
    <div class="needle" id="needle"></div>
    <div class="needle-pivot"></div>
  </div>

  <!-- Pantalla de Nota & Frecuencia -->
  <div class="note-display">
    <div class="note-name" id="noteName">--</div>
    <div class="frequency-text" id="frequencyText">0.0 Hz</div>
    <div class="cents-text" id="centsText">Presiona "Iniciar Micrófono"</div>
  </div>

  <!-- Clavijero Guitarra -->
  <div class="headstock" id="guitarHeadstock">
    <button class="string-btn" id="str-6th" onclick="selectString('str-6th', guitarTuningMode === 'dropD' ? 'D2' : 'E2', guitarTuningMode === 'dropD' ? 73.42 : 82.41)"><span class="string-name" id="name-6str">E2</span><span class="string-desc">6ª Cuerda</span></button>
    <button class="string-btn" id="str-1st" onclick="selectString('str-1st', 'E4', 329.63)"><span class="string-name">E4</span><span class="string-desc">1ª Cuerda</span></button>
    <button class="string-btn" id="str-5th" onclick="selectString('str-5th', 'A2', 110.00)"><span class="string-name">A2</span><span class="string-desc">5ª Cuerda</span></button>
    <button class="string-btn" id="str-2nd" onclick="selectString('str-2nd', 'B3', 246.94)"><span class="string-name">B3</span><span class="string-desc">2ª Cuerda</span></button>
    <button class="string-btn" id="str-4th" onclick="selectString('str-4th', 'D3', 146.83)"><span class="string-name">D3</span><span class="string-desc">4ª Cuerda</span></button>
    <button class="string-btn" id="str-3rd" onclick="selectString('str-3rd', 'G3', 196.00)"><span class="string-name">G3</span><span class="string-desc">3ª Cuerda</span></button>
  </div>

  <!-- Clavijero Charango (Temple Natural con 3º Orden E4 Octava) -->
  <div class="headstock" id="charangoHeadstock" style="display: none;">
    <button class="string-btn" id="str-ch-G4" onclick="selectString('str-ch-G4', 'G4', 392.00)"><span class="string-name">G4 (Sol)</span><span class="string-desc">5º Orden</span></button>
    <button class="string-btn" id="str-ch-E5" onclick="selectString('str-ch-E5', 'E5', 659.25)"><span class="string-name">E5 (Mi)</span><span class="string-desc">1º Orden</span></button>
    <button class="string-btn" id="str-ch-C5" onclick="selectString('str-ch-C5', 'C5', 523.25)"><span class="string-name">C5 (Do)</span><span class="string-desc">4º Orden</span></button>
    <button class="string-btn" id="str-ch-A4" onclick="selectString('str-ch-A4', 'A4', 440.00)"><span class="string-name">A4 (La)</span><span class="string-desc">2º Orden</span></button>
    <button class="string-btn" id="str-ch-E4" onclick="selectString('str-ch-E4', 'E4', 329.63)" style="grid-column: span 2;"><span class="string-name">E4 (Mi)</span><span class="string-desc">3º Orden (Octava)</span></button>
  </div>

  <!-- Piano Teclado Realista (Modo Cromático) -->
  <div class="piano-container" id="pianoContainer">
    <div class="piano-keys-wrapper">
      <!-- Teclas Blancas -->
      <button class="white-key" id="pKey-C4" onclick="playPianoKey('C4', 261.63)">C4</button>
      <button class="white-key" id="pKey-D4" onclick="playPianoKey('D4', 293.66)">D4</button>
      <button class="white-key" id="pKey-E4" onclick="playPianoKey('E4', 329.63)">E4</button>
      <button class="white-key" id="pKey-F4" onclick="playPianoKey('F4', 349.23)">F4</button>
      <button class="white-key" id="pKey-G4" onclick="playPianoKey('G4', 392.00)">G4</button>
      <button class="white-key" id="pKey-A4" onclick="playPianoKey('A4', 440.00)">A4</button>
      <button class="white-key" id="pKey-B4" onclick="playPianoKey('B4', 493.88)">B4</button>
      <!-- Teclas Negras Intercaladas -->
      <button class="black-key" id="pKey-C#4" style="left: 9.5%;" onclick="playPianoKey('C#4', 277.18)">C#</button>
      <button class="black-key" id="pKey-D#4" style="left: 23.8%;" onclick="playPianoKey('D#4', 311.13)">D#</button>
      <button class="black-key" id="pKey-F#4" style="left: 52.3%;" onclick="playPianoKey('F#4', 369.99)">F#</button>
      <button class="black-key" id="pKey-G#4" style="left: 66.6%;" onclick="playPianoKey('G#4', 415.30)">G#</button>
      <button class="black-key" id="pKey-A#4" style="left: 80.9%;" onclick="playPianoKey('A#4', 466.16)">A#</button>
    </div>
  </div>

  <!-- Sección de Donación / Apoyo (Ko-fi con target="_blank") -->
  <div class="support-box">
    <div class="support-text">
      🚫 <b>100% Gratis y sin anuncios</b><br>
      Si te sirve el afinador, ¡apoya el proyecto invitándome un café!
    </div>
    <a href="https://ko-fi.com/johnnybgoodeband" target="_blank" class="kofi-btn">
      ☕ Invítame un café en Ko-fi
    </a>
  </div>

  <!-- Botón Encender / Apagar -->
  <div class="controls">
    <button class="btn-main" id="micBtn" onclick="toggleMic()">Iniciar Micrófono</button>
  </div>

  <script>
    // Arrays de Instrumentos
    const guitarStandard = [
      { id: "str-6th", name: "E2", freq: 82.41 },
      { id: "str-5th", name: "A2", freq: 110.00 },
      { id: "str-4th", name: "D3", freq: 146.83 },
      { id: "str-3rd", name: "G3", freq: 196.00 },
      { id: "str-2nd", name: "B3", freq: 246.94 },
      { id: "str-1st", name: "E4", freq: 329.63 }
    ];

    const guitarDropD = [
      { id: "str-6th", name: "D2", freq: 73.42 },
      { id: "str-5th", name: "A2", freq: 110.00 },
      { id: "str-4th", name: "D3", freq: 146.83 },
      { id: "str-3rd", name: "G3", freq: 196.00 },
      { id: "str-2nd", name: "B3", freq: 246.94 },
      { id: "str-1st", name: "E4", freq: 329.63 }
    ];

    const charangoStrings = [
      { id: "str-ch-G4", name: "G4", freq: 392.00 },
      { id: "str-ch-C5", name: "C5", freq: 523.25 },
      { id: "str-ch-E4", name: "E4", freq: 329.63 },
      { id: "str-ch-A4", name: "A4", freq: 440.00 },
      { id: "str-ch-E5", name: "E5", freq: 659.25 }
    ];

    const noteNames12 = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    let activeInstrument = 'guitar';
    let currentSubmode = 'auto';
    let guitarTuningMode = 'standard';
    
    let selectedBtnId = "str-6th";
    let selectedManualName = "E2";
    let selectedManualFreq = 82.41;

    let sharedAudioCtx = null;
    let analyser = null;
    let micStream = null;
    let micSourceNode = null;
    let isListening = false;
    let smoothFreq = 0;

    function getAudioContext() {
      if (!sharedAudioCtx || sharedAudioCtx.state === 'closed') {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        sharedAudioCtx = new AudioCtxClass();
      }
      if (sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume();
      }
      return sharedAudioCtx;
    }

    // Cambiar Instrumento
    function switchInstrument(inst) {
      activeInstrument = inst;
      document.getElementById('tabGuitar').classList.toggle('active', inst === 'guitar');
      document.getElementById('tabCharango').classList.toggle('active', inst === 'charango');
      document.getElementById('tabChromatic').classList.toggle('active', inst === 'chromatic');

      document.getElementById('guitarHeadstock')["style"]["display"] = (inst === 'guitar') ? 'grid' : 'none';
      document.getElementById('charangoHeadstock')["style"]["display"] = (inst === 'charango') ? 'grid' : 'none';
      document.getElementById('pianoContainer')["style"]["display"] = (inst === 'chromatic') ? 'block' : 'none';
      
      document.getElementById('tuningToggle')["style"]["display"] = (inst === 'guitar') ? 'flex' : 'none';

      deselectAllButtons();
      resetDisplay();
    }

    // Cambiar Afinación Guitarra
    function setGuitarTuning(type) {
      guitarTuningMode = type;
      document.getElementById('tuneStandard').classList.toggle('active', type === 'standard');
      document.getElementById('tuneDropD').classList.toggle('active', type === 'dropD');

      const name6 = document.getElementById('name-6str');
      const btn6 = document.getElementById('str-6th');

      if (type === 'dropD') {
        if (name6) name6.textContent = "D2";
        if (btn6) btn6.onclick = function() { selectString('str-6th', 'D2', 73.42); };
        if (selectedBtnId === 'str-6th' || selectedManualName === 'E2') {
          selectedManualName = "D2";
          selectedManualFreq = 73.42;
        }
      } else {
        if (name6) name6.textContent = "E2";
        if (btn6) btn6.onclick = function() { selectString('str-6th', 'E2', 82.41); };
        if (selectedBtnId === 'str-6th' || selectedManualName === 'D2') {
          selectedManualName = "E2";
          selectedManualFreq = 82.41;
        }
      }
      deselectAllButtons();
    }

    // Cambiar Submodo
    function setSubmode(mode) {
      currentSubmode = mode;
      document.getElementById('subAuto').classList.toggle('active', mode === 'auto');
      document.getElementById('subManual').classList.toggle('active', mode === 'manual');
      if (mode === 'auto') deselectAllButtons();
      else highlightButton(selectedBtnId);
    }

    // Seleccionar Cuerda
    function selectString(btnId, nameVal, freq) {
      selectedBtnId = btnId;
      selectedManualName = nameVal;
      selectedManualFreq = freq;
      highlightButton(btnId);
      playTone(freq);
      if (currentSubmode === 'auto') setSubmode('manual');
    }

    // Tocar Tecla de Piano
    function playPianoKey(nameVal, freq) {
      const keyId = `pKey-${nameVal}`;
      selectedBtnId = keyId;
      selectedManualName = nameVal;
      selectedManualFreq = freq;
      highlightButton(keyId);
      playPianoTone(freq);
    }

    function highlightButton(idVal) {
      deselectAllButtons();
      const el = document.getElementById(idVal);
      if (el) el.classList.add('selected');
    }

    function deselectAllButtons() {
      document.querySelectorAll('.string-btn, .white-key, .black-key').forEach(b => b.classList.remove('selected'));
    }

    // Sintetizador Tono de Cuerda
    function playTone(freq) {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.exponentialRampToValueAtTime(0.4, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 1.4);
      } catch (e) {
        console.error(e);
      }
    }

    // Sintetizador Tono de Piano
    function playPianoTone(freq) {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const duration = 1.6;

        const masterGain = ctx.createGain();
        masterGain.gain.setValueAtTime(0.5, now);
        masterGain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        masterGain.connect(ctx.destination);

        const osc1 = ctx.createOscillator();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(freq, now);
        osc1.connect(masterGain);

        const osc2 = ctx.createOscillator();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(freq * 2, now);
        const gain2 = ctx.createGain();
        gain2.gain.setValueAtTime(0.25, now);
        osc2.connect(gain2);
        gain2.connect(masterGain);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + duration);
        osc2.stop(now + duration);
      } catch (e) {
        console.error(e);
      }
    }

    // Obtener Micrófono
    async function getMicrophoneStream() {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          return await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
          });
        } catch (e) {
          return await navigator.mediaDevices.getUserMedia({ audio: true });
        }
      } else {
        const getUserMediaFunc = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia;
        if (!getUserMediaFunc) throw new Error("getUserMedia no disponible");
        return new Promise((resolve, reject) => {
          getUserMediaFunc["call"](navigator, { audio: true }, resolve, reject);
        });
      }
    }

    async function toggleMic() {
      if (isListening) stopMic();
      else await startMic();
    }

    async function startMic() {
      try {
        const ctx = getAudioContext();

        micStream = await getMicrophoneStream();
        micSourceNode = ctx.createMediaStreamSource(micStream);
        
        analyser = ctx.createAnalyser();
        analyser.fftSize = 2048;
        micSourceNode.connect(analyser);

        isListening = true;
        document.getElementById('micBtn').textContent = "Detener Micrófono";
        document.getElementById('micBtn')["style"]["background"] = "linear-gradient(135deg, #ff5252, #ff1744)";
        document.getElementById('centsText').textContent = "Escuchando...";

        updatePitch();
      } catch (err) {
        console.error("Error al iniciar micrófono:", err);
        alert("Atención: No se pudo acceder al micrófono. Verifica los permisos en Ajustes -> Aplicaciones.");
        document.getElementById('centsText').textContent = "Permiso de micrófono denegado";
        document.getElementById('centsText')["style"]["color"] = "var(--accent-red)";
      }
    }

    function stopMic() {
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
      }
      if (micSourceNode) {
        micSourceNode.disconnect();
        micSourceNode = null;
      }
      isListening = false;
      document.getElementById('micBtn').textContent = "Iniciar Micrófono";
      document.getElementById('micBtn')["style"]["background"] = "linear-gradient(135deg, var(--accent-green), var(--accent-blue))";
      document.getElementById('centsText').textContent = "Micrófono detenido";
      document.getElementById('centsText')["style"]["color"] = "var(--text-muted)";
      resetDisplay();
    }

    function resetDisplay() {
      document.getElementById('needle')["style"]["transform"] = "translateX(-50%) rotate(0deg)";
      document.getElementById('needle').classList.remove('in-tune');
      document.getElementById('noteName').classList.remove('in-tune');
      document.getElementById('noteName').textContent = "--";
      document.getElementById('frequencyText').textContent = "0.0 Hz";
    }

    // Autocorrelación
    function autoCorrelate(buf, sampleRate) {
      let SIZE = buf.length, rms = 0;
      for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
      rms = Math.sqrt(rms / SIZE);
      if (rms < 0.015) return -1;

      let r1 = 0, r2 = SIZE - 1, thres = 0.2;
      for (let i = 0; i < SIZE / 2; i++) { if (Math.abs(buf[i]) < thres) { r1 = i; break; } }
      for (let i = 1; i < SIZE / 2; i++) { if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; } }

      buf = buf.slice(r1, r2);
      SIZE = buf.length;

      let c = new Float32Array(SIZE);
      for (let i = 0; i < SIZE; i++) {
        for (let j = 0; j < SIZE - i; j++) c[i] += buf[j] * buf[j + i];
      }

      let d = 0;
      while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;

      for (let i = d; i < SIZE; i++) {
        if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
      }

      let T0 = maxpos;
      let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
      let a = (x1 + x3 - 2 * x2) / 2, b = (x3 - x1) / 2;
      if (a) T0 = T0 - b / (2 * a);

      return sampleRate / T0;
    }

    function getNoteFromFrequency(freq) {
      const noteNum = 12 * (Math.log2(freq / 440)) + 69;
      const nearestNote = Math.round(noteNum);
      const noteNameVal = noteNames12[(nearestNote % 12 + 12) % 12];
      const octave = Math.floor(nearestNote / 12) - 1;
      const targetFreq = 440 * Math.pow(2, (nearestNote - 69) / 12);
      const cents = 1200 * Math.log2(freq / targetFreq);
      return { noteNameStr: `${noteNameVal}${octave}`, targetFreq, cents };
    }

    // Bucle de Detección
    function updatePitch() {
      if (!isListening || !analyser) return;

      const buf = new Float32Array(2048);
      analyser.getFloatTimeDomainData(buf);
      const sampleRate = sharedAudioCtx ? sharedAudioCtx.sampleRate : 44100;
      const pitch = autoCorrelate(buf, sampleRate);

      if (pitch !== -1 && pitch > 50 && pitch < 1000) {
        smoothFreq = smoothFreq === 0 ? pitch : smoothFreq * 0.7 + pitch * 0.3;
        
        let detectedNote, cents, targetFrequency;

        if (activeInstrument === 'chromatic') {
          const chromData = getNoteFromFrequency(smoothFreq);
          detectedNote = chromData.noteNameStr;
          cents = chromData.cents;
          targetFrequency = chromData.targetFreq;
          const baseNote = detectedNote.replace(/\d/g, "");
          highlightButton(`pKey-${baseNote}4`);
        } else if (activeInstrument === 'charango') {
          if (currentSubmode === 'auto') {
            const closest = charangoStrings.reduce((prev, curr) => 
              Math.abs(curr.freq - smoothFreq) < Math.abs(prev.freq - smoothFreq) ? curr : prev
            );
            detectedNote = closest["name"];
            targetFrequency = closest.freq;
            cents = 1200 * Math.log2(smoothFreq / closest.freq);
            highlightButton(closest["id"]);
          } else {
            detectedNote = selectedManualName;
            targetFrequency = selectedManualFreq;
            cents = 1200 * Math.log2(smoothFreq / selectedManualFreq);
          }
        } else {
          // Guitarra
          const currentGuitarArray = guitarTuningMode === 'dropD' ? guitarDropD : guitarStandard;
          if (currentSubmode === 'auto') {
            const closest = currentGuitarArray.reduce((prev, curr) => 
              Math.abs(curr.freq - smoothFreq) < Math.abs(prev.freq - smoothFreq) ? curr : prev
            );
            detectedNote = closest["name"];
            targetFrequency = closest.freq;
            cents = 1200 * Math.log2(smoothFreq / closest.freq);
            highlightButton(closest["id"]);
          } else {
            detectedNote = selectedManualName;
            targetFrequency = selectedManualFreq;
            cents = 1200 * Math.log2(smoothFreq / selectedManualFreq);
          }
        }

        // Animación de Aguja
        const rotationAngle = Math.max(-50, Math.min(50, cents));
        const needleEl = document.getElementById('needle');
        const noteNameEl = document.getElementById('noteName');
        const centsTextEl = document.getElementById('centsText');

        needleEl["style"]["transform"] = `translateX(-50%) rotate(${rotationAngle}deg)`;
        document.getElementById('frequencyText').textContent = `${smoothFreq.toFixed(1)} Hz`;
        noteNameEl.textContent = detectedNote;

        if (Math.abs(cents) <= 3) {
          needleEl.classList.add('in-tune');
          noteNameEl.classList.add('in-tune');
          centsTextEl.textContent = "¡AFINADO!";
          centsTextEl["style"]["color"] = "var(--accent-green)";
        } else {
          needleEl.classList.remove('in-tune');
          noteNameEl.classList.remove('in-tune');
          if (cents < 0) {
            centsTextEl.textContent = `Bajo (-${Math.abs(Math.round(cents))} cents)`;
            centsTextEl["style"]["color"] = "var(--accent-orange)";
          } else {
            centsTextEl.textContent = `Alto (+${Math.round(cents)} cents)`;
            centsTextEl["style"]["color"] = "var(--accent-red)";
          }
        }
      }

      requestAnimationFrame(updatePitch);
    }
  </script>
